version: '3.8'

services:
  # Caddy reverse proxy with automatic SSL
  caddy:
    image: caddy:latest
    container_name: risev-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_API=${DOMAIN_API}
    depends_on:
      - pocketbase
    networks:
      - risev-network

  # PocketBase Go Backend
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: risev-pocketbase
    restart: unless-stopped
    working_dir: /pb
    command: serve --http=0.0.0.0:8090 --dir=/pb/pb_data --hooksDir=/pb/pb_hooks --migrationsDir=/pb/pb_migrations
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_hooks:/pb/pb_hooks
      - ./pb_migrations:/pb/pb_migrations
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SENDER=${SMTP_SENDER}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - CHIPIN_BRAND_ID=${CHIPIN_BRAND_ID}
      - CHIPIN_API_KEY=${CHIPIN_API_KEY}
      - CHIPIN_WEBHOOK_PUBLIC_KEY=${CHIPIN_WEBHOOK_PUBLIC_KEY}
      - JNT_CUST_CODE=${JNT_CUST_CODE}
      - JNT_API_KEY=${JNT_API_KEY}
      - JNT_ENV=${JNT_ENV}
    networks:
      - risev-network

  # Litestream SQLite backup
  litestream:
    image: litestream/litestream:latest
    container_name: risev-litestream
    restart: unless-stopped
    volumes:
      - ./pb_data:/pb_data
      - ./litestream.yml:/etc/litestream.yml
    command: replicate
    depends_on:
      - pocketbase
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
    networks:
      - risev-network

  # Portainer Visual Container Console
  portainer:
    image: portainer/portainer-ce:latest
    container_name: risev-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - risev-network

volumes:
  caddy_data:
  caddy_config:
  portainer_data:

networks:
  risev-network:
    driver: bridge
