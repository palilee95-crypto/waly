# Long-lived caching for content-hashed build output.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The shell names the current build's chunks; reusing an old copy points the
# browser at files that no longer exist and blanks the app.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# A missing build file must 404, never fall through to the SPA shell: a script
# request answered with HTML is parsed as JS and never boots.
[[redirects]]
  from = "/_expo/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
